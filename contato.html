<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Aura Exótica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contato">
  <header>
    <div class="header-main">
      <div class="container header-inner">
        <a href="index.html" class="logo"><img src="assets/Logo-Aura-Exotica.svg" alt="Aura Exótica"></a>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-header"><h2>Contato</h2></div>
      <form class="contact-form">
        <input type="text" placeholder="Seu nome" required>
        <input type="email" placeholder="Seu e-mail" required>
        <textarea placeholder="Sua mensagem" rows="5" required></textarea>
        <button class="btn-story" type="submit">Enviar mensagem</button>
      </form>
      <p style="margin-top:20px;">WhatsApp: <a href="https://wa.me/5511999999999" target="_blank">+55 (11) 99999-9999</a></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
