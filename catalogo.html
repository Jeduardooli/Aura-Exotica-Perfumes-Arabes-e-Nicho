<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Aura Exótica | Perfumes Árabes & Nicho</title>
    <meta name="description" content="Descubra nossa curadoria exclusiva de perfumes árabes e nicho. Autenticidade, luxo e aroma inconfundível. Compre via WhatsApp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Estilos específicos da página de catálogo podem ser adicionados aqui */
        .filters-container {
            background: var(--bg-alt);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }
        .filter-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-pill);
            font-size: var(--text-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-btn.active {
            background: var(--gold);
            color: var(--dark);
            border-color: var(--gold);
        }
        .search-bar {
            width: 100%;
            padding: var(--space-sm);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            margin-bottom: var(--space-md);
        }
        .results-count {
            color: var(--text-muted);
            margin-bottom: var(--space-md);
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space-md);
        }
        @media (min-width: 768px) {
            .catalog-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .catalog-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .load-more-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: var(--space-xl) auto 0;
            padding: var(--space-md) var(--space-lg);
            background: var(--gold);
            color: var(--dark);
            border: none;
            border-radius: var(--radius-md);
            font-weight: var(--font-bold);
            cursor: pointer;
            transition: var(--transition);
        }
        .load-more-btn:hover {
            background: var(--gold-dark);
        }
        .skeleton-card { /* Exemplo de classe para skeleton loading */
            background: var(--bg-alt);
            border-radius: var(--radius-md);
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body>
    <include src="partials/header.html"></include>
    <main>
        <section class="page-hero">
            <div class="container text-center">
                <h1>Catálogo de Fragrâncias</h1>
                <p>Autenticidade, luxo e aroma inconfundível.</p>
            </div>
        </section>

        <div class="container">
            <div class="filters-container">
                <div class="filter-row">
                    <input type="text" id="filter-search" class="search-bar" placeholder="Buscar...">
                </div>
                <div class="filter-row">
                    <select id="filter-sort" class="filter-select">
                        <option value="default">Ordenar por: Padrão</option>
                        <option value="price-low">Preço: Menor ao Maior</option>
                        <option value="price-high">Preço: Maior ao Menor</option>
                        <option value="name-asc">Nome: A-Z</option>
                        <option value="name-desc">Nome: Z-A</option>
                    </select>
                </div>
                <div class="filter-row">
                    <button class="filter-btn active" data-filter="gender" data-value="all">Todas</button>
                    <button class="filter-btn" data-filter="gender" data-value="M">Masculino</button>
                    <button class="filter-btn" data-filter="gender" data-value="F">Feminino</button>
                    <button class="filter-btn" data-filter="gender" data-value="U">Unissex</button>
                </div>
                <div class="filter-row" id="filter-brands-container">
                    <!-- Preenchido via JS -->
                </div>
                <div class="filter-row" id="filter-categories-container">
                    <!-- Preenchido via JS -->
                </div>
            </div>

            <div class="results-count" id="results-count">
                <!-- Preenchido via JS -->
            </div>

            <div class="catalog-grid" id="catalog-grid">
                <!-- Exibe skeletons enquanto carrega -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <!-- Os produtos reais serão injetados aqui via JS -->
            </div>

            <button id="load-more-btn" class="load-more-btn d-none">Carregar Mais</button>
        </div>
    </main>
    <include src="partials/footer.html"></include>
    <script src="js/script.js"></script>
</body>
</html>
